packages:
  - "chrome-extension"
  - "pages/*"
  - "packages/*"

# pnpm 11+ reads settings only from here (not from package.json "pnpm" or .npmrc).
engineStrict: true

# Dependency install scripts must be allowed explicitly. Denied ones are not needed:
# agent-browser downloads its native CLI (we use the JS API), *driver fetch WebDriver binaries,
# core-js and protobufjs only print banners/checks.
allowBuilds:
  "@swc/core": true
  esbuild: true
  unrs-resolver: true
  agent-browser: false
  core-js: false
  edgedriver: false
  geckodriver: false
  protobufjs: false

# Security floors for transitive dependencies (see pnpm audit).
overrides:
  "cross-spawn": "^7.0.5"
  "tar-fs": "^3.1.1"
  "glob": "^11.0.1"
  "preact": "^10.27.3"
  "@isaacs/brace-expansion": "^5.0.1"
  "diff": "^4.0.4"
  "lodash@>=4.0.0 <=4.17.23": "^4.18.0"
  "fast-xml-parser@>=5.0.0 <5.5.6": "^5.5.6"
  "protobufjs@<=7.5.5": "^7.5.6"
  "langsmith@<0.6.0": "^0.6.0"
  "minimatch@>=5.0.0 <5.1.8": "^5.1.8"
  "minimatch@>=9.0.0 <9.0.7": "^9.0.7"
  "minimatch@>=10.0.0 <10.2.3": "^10.2.3"
  "picomatch@<2.3.2": "^2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "^4.0.4"
  "undici@>=6.0.0 <6.24.0": "^6.24.0"
  "undici@>=7.0.0 <7.24.0": "^7.24.0"
  "minimatch@<3.1.3": "^3.1.3"
  "yaml@>=2.0.0 <2.8.3": "^2.8.3"
  "ws@>=8.0.0 <8.20.1": "^8.20.1"
  "ip-address@<=10.1.0": "^10.1.1"
  "fast-xml-parser@<5.7.0": "^5.7.0"
  "serialize-javascript@<=7.0.2": "^7.0.3"
  "serialize-javascript@<7.0.5": "^7.0.5"
  "flatted@<3.4.0": "^3.4.0"
  "flatted@<=3.4.1": "^3.4.2"
  "fast-uri@<=3.1.0": "^3.1.1"
  "fast-uri@<=3.1.1": "^3.1.2"
  "rollup@>=4.0.0 <4.59.0": "^4.59.0"
  "@types/node": "^22.20.5"
  "nanoid@<3.3.18": "^3.3.18"
  "uuid@<11.1.1": "^11.1.1"
  "@opentelemetry/core@<2.8.0": "^2.8.0"
  "basic-ftp@<6.2.1": "^6.2.1"
  "@puppeteer/browsers@<3": "^3.2.6"
  "zod@>=4.0.0 <4.6.6": "^4.6.6"

auditConfig:
  ignoreGhsas:
    # zod 3.x has no fix (patched only in >=4.6.6) and the 3.x consumers break on zod 4 (`z.record(v)`, `error.errors`).
    # They are dev-only and never bundled: agent-browser 0.19 (dev-utils companion) and eslint-plugin-react-hooks.
    # The extension ships zod 4, kept patched by the override above.
    - GHSA-mrhx-c7xc-m3w5

# Tested on 2026-10-23 (unit tests + real-browser E2E) while younger than pnpm's 1-day minimumReleaseAge.
# Exact versions only: any newer release still waits the full day.
minimumReleaseAgeExclude:
  - "@eslint-react/ast@5.28.7"
  - "@eslint-react/core@5.28.7"
  - "@eslint-react/eslint-plugin@5.28.7"
  - "@eslint-react/eslint@5.28.7"
  - "@eslint-react/jsx@5.28.7"
  - "@eslint-react/shared@5.28.7"
  - "@eslint-react/var@5.28.7"
  - "@langchain/anthropic@1.6.0"
  - "@langchain/core@1.3.0"
  - "@langchain/deepseek@1.1.19"
  - "@langchain/openai@1.7.0"
  - "@langchain/xai@1.5.0"
  - "@posthog/browser-common@0.9.10"
  - "@posthog/core@1.60.0"
  - "baseline-browser-mapping@2.11.31"
  - "eslint-plugin-react-dom@5.28.7"
  - "eslint-plugin-react-jsx@5.28.7"
  - "eslint-plugin-react-naming-convention@5.28.7"
  - "eslint-plugin-react-rsc@5.28.7"
  - "eslint-plugin-react-web-api@5.28.7"
  - "eslint-plugin-react-x@5.28.7"
  - "langsmith@0.11.1"
  - "openai@7.43.0"
  - "posthog-js@1.438.20"
