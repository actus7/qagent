name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from package.json "packageManager" (pnpm 11; settings live in pnpm-workspace.yaml).
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Build
        run: pnpm build

      # After build: vitest loads chrome-extension/vite.config.mts, which imports built workspace packages.
      - name: Test
        run: pnpm -r --if-present test

      - name: Install Chromium for e2e
        run: pnpm exec playwright-core install --with-deps chromium

      - name: E2E (built extension + fake LLM)
        run: node --test e2e/extension.test.mjs

      - name: Security audit (production, high+)
        run: pnpm audit --prod --audit-level high

      - name: Security audit (workspace, high+)
        run: pnpm audit --audit-level high
